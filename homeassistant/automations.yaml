# Deploy: scp to NUC /tmp then:
#   sudo cp /tmp/automations.yaml.new /var/lib/homeassistant/homeassistant/automations.yaml
# In HA: Developer tools → YAML → Reload automations (or restart Core).
#
# Vercel: set HOME_ASSISTANT_GATE_WEBHOOK_URL to your public HA base + path below.
#
# Gate pulse — ONE automation only:
# Supabase `telegram-alerts` sets DB `TRIGGERED_COOLDOWN` AND POSTs the same webhook as
# `/trigger_gate_*`. Pulsing again on REST `sensor.*_gate_status → TRIGGERED_COOLDOWN` doubles
# the relay click (gate opens then stops). Keep the REST sensor for dashboards; do not attach a
# second pulse to it.

# Public URL (HTTPS) must reach Home Assistant, e.g. Nabu Casa / Cloudflare Tunnel:
#   https://<your-ha>/api/webhook/vercel_gate_v1_a8f3c91d
- id: telegram_gate_webhook_pulse
  alias: Gate pulse (Telegram manual + geofence auto via webhook)
  trigger:
    - platform: webhook
      webhook_id: vercel_gate_v1_a8f3c91d
      local_only: false
  action:
    # Single physical pulse; wait 4s then optional second pulse only if Sonoff is still unavailable.
    - service: switch.turn_on
      target:
        entity_id: switch.sonoff_1001dd6335
    - delay: "00:00:00.700"
    - service: switch.turn_off
      target:
        entity_id: switch.sonoff_1001dd6335
    - delay: "00:00:04"
    - if:
        - condition: state
          entity_id: switch.sonoff_1001dd6335
          state: unavailable
      then:
        - service: switch.turn_on
          target:
            entity_id: switch.sonoff_1001dd6335
        - delay: "00:00:00.700"
        - service: switch.turn_off
          target:
            entity_id: switch.sonoff_1001dd6335
  mode: single

- id: telegram_car_locate
  alias: Telegram Car Locate
  trigger:
    - platform: event
      event_type: telegram_command
      event_data:
        command: /locate
  action:
    - service: shell_command.car_locate
  mode: single

- id: telegram_car_findme
  alias: Telegram Car Findme
  trigger:
    - platform: event
      event_type: telegram_command
      event_data:
        command: /findme
  action:
    - service: shell_command.car_findme
  mode: single

- id: telegram_car_status
  alias: Telegram Car Status
  trigger:
    - platform: event
      event_type: telegram_command
      event_data:
        command: /status
  action:
    - service: shell_command.car_status
  mode: single
