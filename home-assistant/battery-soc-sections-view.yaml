# Lux Power — Battery dashboard (sections view)
# Confirmed entities only (no *_live placeholders).
# Paste into dashboard raw YAML, or merge this view into `views:`.
# https://www.home-assistant.io/dashboards/sections/

views:
  - type: sections
    title: Battery SOC
    path: battery-soc
    icon: mdi:battery
    show_icon_and_title: true
    max_columns: 3
    dense_section_placement: false
    badges:
      - type: entity
        entity: sensor.luxpower_inverter_battery_battery_soc
        show_name: false
        show_state: true
        show_icon: true
        show_entity_picture: true
        color: green
    header:
      card:
        type: markdown
        text_only: true
        content: |
          ## Battery
          State of charge, DC bus, and pack power
      layout: center
      badges_position: bottom
      badges_wrap: scroll
    sections:
      - type: grid
        background: false
        cards:
          - type: heading
            heading: Snapshot
            heading_style: title
          - type: gauge
            entity: sensor.luxpower_inverter_battery_battery_soc
            name: State of charge
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: "#c62828"
              - from: 25
                color: "#f9a825"
              - from: 50
                color: "#2e7d32"
          - type: tile
            entity: sensor.luxpower_inverter_battery_battery_voltage
            name: Voltage
            color: cyan
          - type: tile
            entity: sensor.luxpower_inverter_battery_battery_capacity
            name: Capacity
            color: indigo
          - type: tile
            entity: sensor.luxpower_inverter_battery_battery_parallel_number
            name: Parallel strings
            color: blue-grey
      - type: grid
        background: true
        cards:
          - type: heading
            heading: Power
            heading_style: title
          - type: tile
            entity: sensor.luxpower_inverter_battery_battery_charge_power
            name: Charge power
            color: green
          - type: tile
            entity: sensor.luxpower_inverter_battery_battery_discharge_power
            name: Discharge power
            color: deep-orange
      - type: grid
        cards:
          - type: heading
            heading: Details
            heading_style: title
          - type: entities
            title: All metrics
            state_color: true
            show_header_toggle: false
            entities:
              - entity: sensor.luxpower_inverter_battery_battery_soc
                name: State of charge
              - type: divider
              - entity: sensor.luxpower_inverter_battery_battery_voltage
                name: Voltage
              - entity: sensor.luxpower_inverter_battery_battery_capacity
                name: Capacity
              - entity: sensor.luxpower_inverter_battery_battery_parallel_number
                name: Parallel number
              - entity: sensor.luxpower_inverter_battery_battery_charge_power
                name: Charge power
              - entity: sensor.luxpower_inverter_battery_battery_discharge_power
                name: Discharge power
      - type: grid
        cards:
          - type: heading
            heading: History
            heading_style: title
          - type: history-graph
            title: SOC and power — last 48 h
            hours_to_show: 48
            entities:
              - entity: sensor.luxpower_inverter_battery_battery_soc
                name: SOC
              - entity: sensor.luxpower_inverter_battery_battery_charge_power
                name: Charge
              - entity: sensor.luxpower_inverter_battery_battery_discharge_power
                name: Discharge
    cards: []
