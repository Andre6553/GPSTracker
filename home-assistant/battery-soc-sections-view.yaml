# Lux Power — Battery dashboard (sections view)
# Confirmed entities only. Layout: one live panel + trends (% vs W separated).
# https://www.home-assistant.io/dashboards/sections/

views:
  - type: sections
    title: Battery SOC
    path: battery-soc
    icon: mdi:battery
    show_icon_and_title: true
    max_columns: 2
    dense_section_placement: true
    badges:
      - type: entity
        entity: sensor.luxpower_inverter_battery_battery_soc
        show_name: false
        show_state: true
        show_icon: true
        show_entity_picture: true
        color: green
    header:
      card:
        type: markdown
        text_only: true
        content: |
          ## Battery
          Live pack status and 48-hour trends
      layout: center
      badges_position: bottom
      badges_wrap: scroll
    sections:
      - type: grid
        background: false
        cards:
          - type: heading
            heading: Live status
            heading_style: title
          - type: gauge
            entity: sensor.luxpower_inverter_battery_battery_soc
            name: State of charge
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: "#c62828"
              - from: 25
                color: "#f9a825"
              - from: 50
                color: "#2e7d32"
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: sensor.luxpower_inverter_battery_battery_voltage
                name: Voltage
                color: cyan
              - type: tile
                entity: sensor.luxpower_inverter_battery_battery_capacity
                name: Capacity
                color: indigo
              - type: tile
                entity: sensor.luxpower_inverter_battery_battery_parallel_number
                name: Parallel strings
                color: blue-grey
              - type: tile
                entity: sensor.luxpower_inverter_battery_battery_charge_power
                name: Charge power
                color: green
              - type: tile
                entity: sensor.luxpower_inverter_battery_battery_discharge_power
                name: Discharge power
                color: deep-orange
      - type: grid
        background: true
        cards:
          - type: heading
            heading: Trends
            heading_style: title
          - type: history-graph
            title: State of charge (48 h)
            hours_to_show: 48
            entities:
              - entity: sensor.luxpower_inverter_battery_battery_soc
                name: SOC
          - type: history-graph
            title: Pack power — charge vs discharge (48 h)
            hours_to_show: 48
            entities:
              - entity: sensor.luxpower_inverter_battery_battery_charge_power
                name: Charging
              - entity: sensor.luxpower_inverter_battery_battery_discharge_power
                name: Discharging
    cards: []
