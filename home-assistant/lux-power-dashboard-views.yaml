# Lux Power — full dashboard `views:` (Battery, Solar PV, Grid, Inverter, Flow Chart).
# Flow Chart uses **Lux Power Distribution Card**. Prefer this repo build (PV1/PV2 labels + Total under strings):
# One-shot deploy to NUC (SSH key + sudo): `powershell -ExecutionPolicy Bypass -File home-assistant/scripts/deploy-lux-card-to-nuc.ps1`
# Or copy `home-assistant/www/lux-power-distribution-card.js` over the HACS file
# `config/www/community/lux-power-distribution-card/lux-power-distribution-card.js` (backup first), then hard-refresh.
# Or serve from `config/www/` and add Resource `/local/lux-power-distribution-card.js` (module) — remove the duplicate HACS resource.
# Flow card refresh is hidden (`button_location: none`): it targets `luxpower.luxpower_refresh_registers`,
# which exists only for the Guy Wells LuxpowerTek integration — yours uses a different service name.
# Flow chart: Lux Power Distribution Card — same as gallery “allocated power” screenshot:
# https://github.com/DanteWinters/lux-power-distribution-card/blob/v2.0.1/docs/images/full-card-allocated-power.png
# Allocated band: consumption.allocated_power_entity (singular entity id). PV1/PV2 lines: array_1/2 only — omit combined_entities
# if you want those lines (combined_entities hides per-string text). This card does not draw PV voltages in the diagram.
# Grid Hz on the flow diagram: patched card `grid.frequency_entities` (repo `www/lux-power-distribution-card.js`).
# Optional: consumption.ups_enabled_entity — when on, bottom-right shows UPS + EPS power; else Load + load power.
# Optional: consumption.load_percentage_entity — “Inverter load %” under that block.
# Optional EPS: consumption.backup_entities (see card docs).
# https://www.home-assistant.io/dashboards/sections/

views:
  - type: sections
    title: Battery SOC
    path: battery-soc
    icon: mdi:battery
    show_icon_and_title: true
    max_columns: 2
    dense_section_placement: true
    badges: []
    header:
      layout: center
      badges_position: bottom
      badges_wrap: scroll
    sections:
      - type: grid
        background: false
        cards:
          - type: heading
            heading: Live status
            heading_style: title
          - type: gauge
            entity: sensor.luxpower_inverter_battery_battery_soc
            name: State of charge
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: "#c62828"
              - from: 25
                color: "#f9a825"
              - from: 50
                color: "#2e7d32"
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: sensor.luxpower_inverter_battery_battery_voltage
                name: Voltage
                color: cyan
              - type: tile
                entity: sensor.luxpower_inverter_battery_battery_capacity
                name: Capacity
                color: indigo
              - type: tile
                entity: sensor.luxpower_inverter_battery_battery_parallel_number
                name: Parallel strings
                color: blue-grey
              - type: tile
                entity: sensor.luxpower_inverter_battery_battery_charge_power
                name: Charge power
                color: green
              - type: tile
                entity: sensor.luxpower_inverter_battery_battery_discharge_power
                name: Discharge power
                color: deep-orange
      - type: grid
        background: true
        cards:
          - type: heading
            heading: Trends
            heading_style: title
          - type: history-graph
            title: State of charge (48 h)
            hours_to_show: 48
            entities:
              - entity: sensor.luxpower_inverter_battery_battery_soc
                name: SOC
          - type: history-graph
            title: Pack power — charge vs discharge (48 h)
            hours_to_show: 48
            entities:
              - entity: sensor.luxpower_inverter_battery_battery_charge_power
                name: Charging
              - entity: sensor.luxpower_inverter_battery_battery_discharge_power
                name: Discharging
    cards: []

  - type: sections
    title: Solar PV
    path: solar-pv
    icon: mdi:solar-panel
    show_icon_and_title: true
    max_columns: 3
    dense_section_placement: true
    badges: []
    header:
      layout: center
      badges_position: bottom
      badges_wrap: scroll
    sections:
      - type: grid
        background: false
        cards:
          - type: heading
            heading: PV Overview
            heading_style: title
          - type: gauge
            entity: sensor.luxpower_inverter_pv_pv_power
            name: Total PV Power
            min: 0
            max: 10000
            needle: true
            segments:
              - from: 0
                color: "#c62828"
              - from: 1500
                color: "#f9a825"
              - from: 3500
                color: "#2e7d32"
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv_power
                name: PV Power
                color: amber
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv_energy_today
                name: Today
                color: green
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv_energy_total
                name: Total
                color: indigo
      - type: grid
        background: true
        cards:
          - type: heading
            heading: PV1
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv1_power
                name: Power
                color: amber
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv1_voltage
                name: Voltage
                color: cyan
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv1_current
                name: Current
                color: deep-purple
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv1_energy_today
                name: Energy today
                color: green
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv1_energy_total
                name: Energy total
                color: indigo
      - type: grid
        background: true
        cards:
          - type: heading
            heading: PV2
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv2_power
                name: Power
                color: amber
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv2_voltage
                name: Voltage
                color: cyan
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv2_current
                name: Current
                color: deep-purple
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv2_energy_today
                name: Energy today
                color: green
              - type: tile
                entity: sensor.luxpower_inverter_pv_pv2_energy_total
                name: Energy total
                color: indigo
      - type: grid
        cards:
          - type: heading
            heading: Trends (48 h)
            heading_style: title
          - type: history-graph
            title: PV Power
            hours_to_show: 48
            entities:
              - entity: sensor.luxpower_inverter_pv_pv_power
                name: Total PV
              - entity: sensor.luxpower_inverter_pv_pv1_power
                name: PV1
              - entity: sensor.luxpower_inverter_pv_pv2_power
                name: PV2
    cards: []
    subview: false

  - type: sections
    title: Grid
    path: grid
    icon: mdi:power-plug
    show_icon_and_title: true
    max_columns: 2
    dense_section_placement: true
    badges:
      - type: entity
        entity: binary_sensor.luxpower_inverter_grid_grid_connected
        show_name: false
        show_state: true
        show_icon: true
        color: green
    header:
      layout: center
      badges_position: bottom
      badges_wrap: scroll
    sections:
      - type: grid
        background: false
        cards:
          - type: heading
            heading: Live status
            heading_style: title
          - type: gauge
            entity: sensor.luxpower_inverter_grid_power_from_grid
            name: Power from grid
            min: 0
            max: 10000
            needle: true
            segments:
              - from: 0
                color: "#2e7d32"
              - from: 2500
                color: "#f9a825"
              - from: 6000
                color: "#c62828"
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: binary_sensor.luxpower_inverter_grid_grid_connected
                name: Grid connected
                color: green
              - type: tile
                entity: sensor.luxpower_inverter_grid_grid_flow
                name: Grid flow
                color: deep-purple
              - type: tile
                entity: sensor.luxpower_inverter_grid_power_from_grid
                name: Power from grid
                color: amber
      - type: grid
        background: true
        cards:
          - type: heading
            heading: Quality & Energy
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.luxpower_inverter_grid_grid_voltage
                name: Voltage
                color: cyan
              - type: tile
                entity: sensor.luxpower_inverter_grid_grid_frequency
                name: Frequency
                color: blue
              - type: tile
                entity: sensor.luxpower_inverter_grid_energy_from_grid_today
                name: From grid today
                color: green
              - type: tile
                entity: sensor.luxpower_inverter_grid_energy_from_grid_total
                name: From grid total
                color: indigo
      - type: grid
        cards:
          - type: heading
            heading: Trends (48 h)
            heading_style: title
          - type: history-graph
            title: Grid power and flow
            hours_to_show: 48
            entities:
              - entity: sensor.luxpower_inverter_grid_power_from_grid
                name: Power from grid
              - entity: sensor.luxpower_inverter_grid_grid_flow
                name: Grid flow
          - type: history-graph
            title: Grid quality
            hours_to_show: 48
            entities:
              - entity: sensor.luxpower_inverter_grid_grid_voltage
                name: Voltage
              - entity: sensor.luxpower_inverter_grid_grid_frequency
                name: Frequency
    cards: []
    subview: false

  - type: sections
    title: Inverter
    path: inverter
    icon: mdi:current-ac
    show_icon_and_title: true
    max_columns: 2
    dense_section_placement: true
    badges: []
    header:
      layout: center
      badges_position: bottom
      badges_wrap: scroll
    sections:
      - type: grid
        background: false
        cards:
          - type: heading
            heading: Live power
            heading_style: title
          - type: gauge
            entity: sensor.luxpower_inverter_energy_flow
            name: Energy flow
            min: 0
            max: 10000
            needle: true
            segments:
              - from: 0
                color: "#c62828"
              - from: 2500
                color: "#f9a825"
              - from: 5000
                color: "#2e7d32"
          - type: gauge
            entity: sensor.luxpower_inverter_load_percentage
            name: Load
            min: 0
            max: 100
            needle: true
            segments:
              - from: 0
                color: "#2e7d32"
              - from: 70
                color: "#f9a825"
              - from: 90
                color: "#c62828"
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.luxpower_inverter_load_power
                name: Load power
                color: amber
              - type: tile
                entity: sensor.luxpower_inverter_inverter_power
                name: Inverter power
                color: deep-purple
              - type: tile
                entity: sensor.luxpower_inverter_inverter_current
                name: Inverter current
                color: cyan
              - type: tile
                entity: sensor.luxpower_inverter_internal_temperature
                name: Internal temp
                color: orange
              - type: tile
                entity: sensor.luxpower_inverter_ac_charging_rectification_power
                name: AC charge rect.
                color: green

      - type: grid
        background: true
        cards:
          - type: heading
            heading: AC & energy
            heading_style: title
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.luxpower_inverter_ac_input_type
                name: AC input
                color: blue
              - type: tile
                entity: sensor.luxpower_inverter_ac_charge_energy_today
                name: AC charge today
                color: green
              - type: tile
                entity: sensor.luxpower_inverter_ac_charge_energy_total
                name: AC charge total
                color: indigo
              - type: tile
                entity: sensor.luxpower_inverter_charge_energy_today
                name: Charge today
                color: green
              - type: tile
                entity: sensor.luxpower_inverter_discharge_energy_today
                name: Discharge today
                color: deep-orange
              - type: tile
                entity: sensor.luxpower_inverter_inverter_energy_today
                name: Inverter energy today
                color: green
              - type: tile
                entity: sensor.luxpower_inverter_inverter_energy_total
                name: Inverter energy total
                color: indigo

      - type: grid
        cards:
          - type: heading
            heading: Status & runtime
            heading_style: title
          - type: entities
            title: Warnings & faults
            state_color: true
            show_header_toggle: false
            entities:
              - entity: sensor.luxpower_inverter_active_warning_code
                name: Warning code
              - entity: sensor.luxpower_inverter_active_warning_text
                name: Warning text
              - entity: sensor.luxpower_inverter_internal_fault_code
                name: Internal fault code
              - type: divider
              - entity: sensor.luxpower_inverter_total_running_time
                name: Running time (raw)
          - type: markdown
            title: Running time (days · hours · sec)
            content: |
              {% set ent = states.sensor.luxpower_inverter_total_running_time %}
              {% set raw = ent.state %}
              {% if raw in ['unknown', 'unavailable', 'none', ''] %}
              *Sensor unavailable*
              {% else %}
              {% set v = raw | float(0) %}
              {% set u = (ent.attributes.get('unit_of_measurement', '') | string | lower) %}
              {% if 'h' == u or 'hour' in u %}
                {% set sec = (v * 3600) | round(0) | int %}
              {% elif 'min' in u %}
                {% set sec = (v * 60) | round(0) | int %}
              {% elif 's' == u or 'sec' in u %}
                {% set sec = v | int %}
              {% else %}
                {% set sec = v | int %}
              {% endif %}
              {% set d = (sec // 86400) %}
              {% set h = ((sec % 86400) // 3600) %}
              {% set srem = (sec - d * 86400 - h * 3600) %}
              **{{ d }}** days · **{{ h }}** h · **{{ srem }}** s  
              <small>After full days and hours, remainder is seconds (0–3599). Unit hint: {{ u | default('(n/a)', true) }}</small>
              {% endif %}

      - type: grid
        cards:
          - type: heading
            heading: Trends (48 h)
            heading_style: title
          - type: history-graph
            title: Power & flow
            hours_to_show: 48
            entities:
              - entity: sensor.luxpower_inverter_energy_flow
                name: Energy flow
              - entity: sensor.luxpower_inverter_load_power
                name: Load power
              - entity: sensor.luxpower_inverter_inverter_power
                name: Inverter power
          - type: history-graph
            title: Temperature & load
            hours_to_show: 48
            entities:
              - entity: sensor.luxpower_inverter_internal_temperature
                name: Internal temp
              - entity: sensor.luxpower_inverter_load_percentage
                name: Load %
    cards: []
    subview: false

  - type: sections
    title: Flow Chart
    path: flow-chart
    icon: mdi:solar-power-variant-outline
    show_icon_and_title: true
    max_columns: 1
    dense_section_placement: true
    badges:
      - type: entity
        entity: sensor.luxpower_inverter_grid_grid_frequency
        show_name: true
        show_state: true
        show_icon: true
        color: blue
    header:
      layout: center
      badges_position: bottom
      badges_wrap: scroll
    sections:
      - type: grid
        background: false
        cards:
          - type: heading
            heading: Live energy flow
            heading_style: title
          - type: custom:lux-power-distribution-card
            inverter_count: 1
            battery:
              soc_entities:
                - sensor.luxpower_inverter_battery_battery_soc
              charge_live_entities:
                - sensor.luxpower_inverter_battery_battery_charge_power
              discharge_live_entities:
                - sensor.luxpower_inverter_battery_battery_discharge_power
              voltage_entities:
                - sensor.luxpower_inverter_battery_battery_voltage
              parallel_average_voltage: false
              capacity_ah_entities:
                - sensor.luxpower_inverter_battery_battery_capacity
              runtime_location: bottom
            refresh:
              lux_dongles:
                - BA24401521
              button_location: none
            grid:
              flow_entities:
                - sensor.luxpower_inverter_grid_grid_flow
              voltage_entities:
                - sensor.luxpower_inverter_grid_grid_voltage
              frequency_entities:
                - sensor.luxpower_inverter_grid_grid_frequency
              indicators:
                hue: true
                dot: false
              parallel_average_voltage: false
            consumption:
              home_entities:
                - sensor.luxpower_inverter_load_power
              load_percentage_entity: sensor.luxpower_inverter_load_percentage
              # When on: red box primary = UPS + eps power. Patched card also treats UPS when grid voltage < ~30 V (0 Vac backup).
              ups_enabled_entity: switch.luxpower_inverter_seamless_eps_switching
              # EPS / backup (UPS) path — card uses this for arrows + EPS watts in the red box when UPS on.
              backup_entities:
                - sensor.luxpower_inverter_eps_eps_power
              # Optional: single entity “Allocated power” (right column when set). Omit if unused.
              # allocated_power_entity: sensor.YOUR_SUMMED_OR_MAIN_CIRCUIT_POWER
            pv:
              # Do not set combined_entities together with array_* — combined wins and you only see one total line.
              array_1_entities:
                - sensor.luxpower_inverter_pv_pv1_power
              array_2_entities:
                - sensor.luxpower_inverter_pv_pv2_power
            temp:
              entities:
                - sensor.luxpower_inverter_internal_temperature
            status_codes:
              entities:
                - sensor.luxpower_inverter_active_warning_code
    cards: []
    subview: false
