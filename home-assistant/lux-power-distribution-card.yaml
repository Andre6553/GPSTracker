# =============================================================================
# Lux Power Distribution Card – Home Assistant Lovelace (v2.0.1 example basis)
# https://github.com/DanteWinters/lux-power-distribution-card/tree/v2.0.1
# =============================================================================
#
# --- To-do: HACS install (you run this in Home Assistant) ---------------------
# 1. HACS → Frontend → search "Lux Power Distribution Card" → Download.
# 2. Restart Home Assistant (Settings → System → Restart) OR hard-refresh the
#    browser (Ctrl+F5) so the card JavaScript loads.
#
# --- To-do: Add card on "Lux Power" dashboard ---------------------------------
# 1. Open sidebar → Lux Power (your dashboard view).
# 2. Edit dashboard (pencil) → Add card → Manual.
# 3. Paste ONLY the YAML below the "BEGIN CARD (paste from here)" line
#    (no # comment lines), save.
#
# --- Entity mapping (LuxpowerTek-style sensor.lux_* names) --------------------
# If your entities differ, open Developer tools → States and swap IDs:
#   battery:     soc, signed flow, voltage, capacity Ah
#   grid:        grid flow, grid voltage
#   consumption: home load; optional EPS/backup
#   pv:          solar / PV total
#   update_time: data received / freshness sensor (timestamp attr if used)
#   temp:        inverter internal temperature
#   status_codes: lux status / fault code sensor
#
# --- Dongle serial (refresh button) ------------------------------------------
# Replace BA12345678 with YOUR dongle serial from the Luxpower integration.
# Use button_location: none to hide refresh (see card README).
#
# --- Troubleshooting -----------------------------------------------------------
# Wrong arrow direction: add invert_flow: true under battery or grid (see
# docs/config/config.md). Split charge/discharge: use charge_live_entities +
# discharge_live_entities instead of flow_entities.
#
# BEGIN CARD (paste from here) -------------------------------------------------

type: custom:lux-power-distribution-card
inverter_count: 1
battery:
  soc_entities:
    - sensor.lux_battery
  flow_entities:
    - sensor.lux_battery_flow_live
  voltage_entities:
    - sensor.lux_battery_voltage_live
  parallel_average_voltage: false
  capacity_ah_entities:
    - sensor.lux_battery_capacity_ah
  runtime_location: bottom
refresh:
  lux_dongles:
    - BA12345678
  button_location: right
grid:
  flow_entities:
    - sensor.lux_grid_flow_live
  voltage_entities:
    - sensor.lux_grid_voltage_live
  indicators:
    hue: true
    dot: false
  parallel_average_voltage: false
consumption:
  home_entities:
    - sensor.lux_home_consumption_live
  backup_entities:
    - sensor.lux_power_to_eps_live
update_time:
  entities:
    - sensor.lux_data_received_time
  show_datetime: false
  show_time_since: true
  has_timestamp_attribute: true
pv:
  combined_entities:
    - sensor.lux_solar_output_array_2_live
temp:
  entities:
    - sensor.lux_internal_temperature_live
status_codes:
  entities:
    - sensor.lux_status
